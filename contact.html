<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact & Inquiries | SonicBloom</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --brand: #ff6a00; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 40px 20px; line-height: 1.6; }
    .container { max-width: 780px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 40px; }
    h1 { font-size: 2.2rem; margin-bottom: 16px; font-weight: 800; }
    p { color: var(--muted); margin-bottom: 16px; }
    .contact-box { background: #f1f5f9; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 24px; margin-top: 20px; font-family: 'Space Mono', monospace; }
    a { color: var(--brand); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/">&larr; Return to Workspace</a>
    <h1 style="margin-top: 20px;">Operator Inquiries</h1>
    <p>For technical infrastructure auditing, enterprise dataset subscription access, or research lab routing partnerships:</p>
    
    <div class="contact-box">
      <div>PRIMARY DISPATCH: <strong>contact@sonicbloom.dev</strong></div>
      <div style="margin-top: 8px;">INTEGRATION DESK: <strong>ops@sonicbloom.dev</strong></div>
      <div style="margin-top: 8px; font-size: 0.8rem; color: var(--muted);">PGP Verification Available Upon Request</div>
    </div>
  </div>
</body>
</html>
